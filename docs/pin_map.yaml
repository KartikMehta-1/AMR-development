schema_version: 0.2.0
profile: final-single-mdd20a   # active wiring profile (authoritative pin map)

board:
  name: Nucleo-F401RE
  clock_hz: 84000000

power:
  battery:
    chemistry: LiFePO4
    nominal_volts: 12.8
    series_cells: 4
    capacity_ah: 18
    connector: nylon_t
  bms:
    model: internal_basic
    continuous_amps: null
    peak_amps: null
    protections: [OVP, UVP, OCP, SCP]    # basic protections; telemetry limited
    notes: Pack includes built-in BMS; exposes only P+/P- (no cell taps or telemetry). Add pack-voltage sense if needed.
  dc_dc:
    jetson_5v:
      input: battery_pack
      output_volts: 5.0
      current_max_amps: 8.0   # target ~6-8 A for Jetson + USB
      notes: Jetson Nano and powered USB hub; consider Mean Well RSD-60G-5 or equivalent wide-input buck
    logic_5v:
      input: battery_pack
      output_volts: 5.0
      current_max_amps: TBD   # 1-2 A typical
      notes: STM32 and proximity sensors
    sensors_12v:
      input: battery_pack
      output_volts: 12.0
      current_max_amps: TBD
      status: optional

motors:
  left:
    driver: cytron_mdd20a
    pwm:
      timer: TIM1
      channel: CH1
      pin: PA8
      frequency_hz: 20000   # active in firmware v2 (TIM1 PSC=0, ARR=4199)
    direction:
      pin: PB4
  right:
    driver: cytron_mdd20a
    pwm:
      timer: TIM1
      channel: CH2
      pin: PA9
      frequency_hz: 20000   # match left channel
    direction:
      pin: PB5

encoders:
  left:
    timer: TIM3
    ch1:
      pin: PA6
    ch2:
      pin: PA7
    counts_per_rev: 2400        # post-gearbox: 600 PPR * 4
    input_type: open_collector
    pullup: external_3v3        # use 4.7-10k to 3.3 V
    max_signal_freq_hz: 30000
    filter_level: 10            # CubeMX ICxFilter value
  right:
    timer: TIM2
    ch1:
      pin: PA0
    ch2:
      pin: PA1
    counts_per_rev: 2400
    input_type: open_collector
    pullup: external_3v3
    max_signal_freq_hz: 30000
    filter_level: 10

uart:
  telemetry:
    instance: USART2
    tx: PA2
    rx: PA3
    baud_bps: 460800

gpio:
  status_led:
    pin: PA5
  user_button:
    pin: PC13

safety:
  estop:
    sense:
      pin: PB10              # Arduino D6 (right rail)
      active_state: low        # low or high
      pull: pullup_3v3         # pullup_3v3 or pulldown
      debounce_ms: 10
    hw_cut:
      type: series_switch      # series_switch / relay / contactor / high_side
      notes: Cut motor VM supply to driver (preferred primary action)

sensors:
  lidar:
    model: ydlidar_g4
    interface: usb
    power_rail: 5v
    nominal_current_amps: 0.5   # confirm from datasheet
    notes: Connect via powered USB hub to Jetson; ensure stable 5 V
  depth_camera:
    model: realsense_d455
    interface: usb3
    power_rail: 5v
    notes: USB 3 bandwidth required; prefer powered hub if multiple devices
  imu:
    model: adafruit_bno080
    interface: i2c
    host: jetson_nano
    power_rail: 3v3
    notes: Connect to Jetson I2C (3.3 V logic). Use STEMMA QT/Qwiic cable if available; keep leads short.
  proximity:
    quantity: 4
    model: hc_sr04_ultrasonic
    power_rail: 5v
    interface: gpio_trig_echo
    units: distance           # mm in firmware
    level_shift: echo_divider_to_3v3   # ensure echo is 3.3 V safe
    firing_strategy: staggered_round_robin
    notes: Stagger triggers to avoid crosstalk; HC-SR04 echo is 5 V (level-shift to 3.3 V); add 0.1 uF + 10 uF per module; keep leads short
    channels:
      - id: S1
        position: front_left
        trig_pin: PA10         # Arduino D2
        echo_pin: PC7          # Arduino D9
        notes: add divider or level shifter on echo if module drives 5 V high
      - id: S2
        position: front_right
        trig_pin: PB3          # Arduino D3
        echo_pin: PB6          # Arduino D10
        notes: add divider or level shifter on echo if module drives 5 V high
      - id: S3
        position: rear_left
        trig_pin: PA4          # Arduino A2
        echo_pin: PC0          # Arduino A5
        notes: add divider or level shifter on echo if module drives 5 V high
      - id: S4
        position: rear_right
        trig_pin: PB9          # Arduino D14 (I2C SDA)
        echo_pin: PB8          # Arduino D15 (I2C SCL)
        notes: add divider or level shifter on echo if module drives 5 V high

buses:
  i2c1:
    scl: TBD
    sda: TBD
    pullups: external_3v3
  i2c2:
    scl: TBD
    sda: TBD
    pullups: external_3v3

adc:
  vref_volts: 3.3
  resolution_bits: 12
  dma: enabled                 # ADC1 configured with DMA circular mode
  channels:
    # Motor current sensing (ACS758 + resistor divider + STM32 ADC)
    - id: motor_left_current
      pin: PB0                 # ADC1_IN8 (configured)
      name: I_MOTOR_LEFT
      source: acs758_vout
      divider:                 # scale 0-5 V to ~0-3.3 V (ratio ~0.667)
        r_top_ohms: 10000      # 10k (Vout from ACS758 to divider top)
        r_bottom_ohms: 20000   # 20k to GND + Vadc = 0.667 * Vsense
        v_in_max_volts: 5.0
        v_out_max_volts: 3.33
      filter:                  # simple post-divider RC for anti-aliasing/noise
        r_series_ohms: 1000
        c_shunt_nf: 100        # fc ~1.6 kHz; adjust per sampling rate
      status: active           # present in ADC regular sequence
    - id: motor_right_current
      pin: PC1                 # ADC1_IN11 (mapped, may be added to sequence)
      name: I_MOTOR_RIGHT
      source: acs758_vout
      divider:
        r_top_ohms: 10000
        r_bottom_ohms: 20000
        v_in_max_volts: 5.0
        v_out_max_volts: 3.33
      filter:
        r_series_ohms: 1000
        c_shunt_nf: 100
      status: active           # included in ADC regular sequence (Rank 2)

current_sensors:
  model: ACS758LCB-050B        # Allegro Hall-effect current sensor +/-50 A
  quantity: 2                  # Left/Right motor lines
  supply_volts: 5.0            # Ratiometric output; 2.5 V at 0 A (typ.)
  placement: series_with_each_motor_supply
  output_interface: analog_single_ended
  variant: ACS758LCB-050B
  sensitivity_mV_per_A: 40     # @5 V; ~26.7 mV/A at ADC after 0.667 divider
  zero_current_offset_volts: ratiometric_to_vcc_over_2
  wiring_notes:
    - Keep high-current paths short; use appropriate gauge and creepage/clearance.
    - Route sensor Vout to STM32 ADC through the divider; add local 0.1 uF decoupling at sensor Vcc.
    - Tie grounds at a star point; avoid running Vout alongside PWM motor leads.

compute:
  jetson_nano:
    power_input_volts: 5.0
    recommended_current_amps: 4.0   # allow up to 6 A with peripherals
    ethernet: true
    usb3_ports: true
    csi_cameras: 2
    gpio_header_40pin: true

drivers:
  cytron_mdd20a:
    m1_pwm: PA8
    m1_dir: PB4
    m2_pwm: PA9
    m2_dir: PB5

notes:
  - Keep this file authoritative; update when wiring or firmware changes.
  - Align TIM1 ARR/PSC to achieve the desired PWM frequency (20 kHz target).
  - Encoder mount is post-gearbox.
