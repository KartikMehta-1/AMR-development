schema_version: 0.2.0
profile: final-single-mdd20a   # active wiring profile (authoritative pin map)

board:
  name: Nucleo-F401RE
  clock_hz: 84000000

power:
  battery:
    chemistry: LiFePO4
    nominal_volts: 12.8
    series_cells: 4
    capacity_ah: 18
    connector: nylon_t
  bms:
    model: internal_basic
    continuous_amps: null
    peak_amps: null
    protections: [OVP, UVP, OCP, SCP]    # basic protections; telemetry limited
    auxiliary_connector: unverified_5_or_6_pin
    notes: Pack includes built-in BMS. Main output is P+/P-. An unused 5/6-pin connector is present but its pinout is unverified; treat it as possibly balance, temperature, or BMS telemetry and do not connect to STM/Jetson until measured and identified. Add protected pack-voltage sense if host telemetry is needed.
  voltage_monitoring:
    status: planned
    preferred_path: INA226_I2C_external_shunt
    source: battery_pack_after_main_fuse
    shunt:
      type: external
      minimum_rating_amps: 50
      preferred_rating_amps: 75_or_100
      typical_full_scale_drop_mv: 75
      placement: after_main_switch_and_main_fuse_before_power_distribution
      notes: Main battery current must pass through the external shunt, not through the INA226 PCB. Use bolted/crimped high-current wiring and Kelvin sense leads to INA226 IN+/IN-.
    monitor:
      ic: INA226
      interface: i2c
      host: stm32_planned
      bus: stm_i2c1_planned
      scl_pin: PB8
      sda_pin: PB9
      vcc: 3v3_preferred
      signals: [VCC, GND, SDA, SCL, IN_PLUS, IN_MINUS, VBUS]
      notes: Use a module that exposes I2C and supports external shunt wiring. STM ownership is planned on PB8/PB9, sharing the STM I2C bus with the IMU. STM firmware/CubeMX must enable I2C before wiring this as an active interface.
    fallback_voltage_only:
      path: STM32_ADC_pack_voltage_divider
      adc_pin_candidate: TBD
      adc_channel_candidate: TBD
      notes: Choose only if INA226 is delayed; do not reuse a proximity pin without updating CubeMX and wiring docs.
    target_topics:
      - /amr_stm/battery_voltage_mv
      - /amr_stm/battery_current_ma
      - /amr_stm/battery_power_mw
    display_module: DSN-DVM_or_DUM-368_panel_meter
    notes: Existing panel meter is currently display-only unless the exact module proves it exposes a telemetry output. Typical 2-wire/3-wire LED voltmeters provide power/sense wiring, not a microcontroller-safe data output. Firmware/ROS telemetry path will be implemented later together with proximity and IMU work.
  dc_dc:
    jetson_5v:
      input: battery_pack
      output_volts: 5.0
      current_max_amps: 8.0   # target ~6-8 A for Jetson + USB
      notes: Jetson Nano and powered USB hub; consider Mean Well RSD-60G-5 or equivalent wide-input buck
    logic_5v:
      input: battery_pack
      output_volts: 5.0
      current_max_amps: TBD   # 1-2 A typical
      notes: STM32 and proximity sensors
    sensors_12v:
      input: battery_pack
      output_volts: 12.0
      current_max_amps: TBD
      status: optional

motors:
  left:
    driver: cytron_mdd20a
    pwm:
      timer: TIM1
      channel: CH1
      pin: PA8
      frequency_hz: 20000   # active in firmware v2 (TIM1 PSC=0, ARR=4199)
    direction:
      pin: PB4
  right:
    driver: cytron_mdd20a
    pwm:
      timer: TIM1
      channel: CH2
      pin: PA9
      frequency_hz: 20000   # match left channel
    direction:
      pin: PB5

encoders:
  left:
    timer: TIM3
    ch1:
      pin: PA6
    ch2:
      pin: PA7
    counts_per_rev: 2400        # TI12 quadrature decode target (x4)
    input_type: open_collector
    pullup: external_3v3        # use 4.7-10k to 3.3 V
    max_signal_freq_hz: 30000
    filter_level: 10            # CubeMX ICxFilter value
  right:
    timer: TIM2
    ch1:
      pin: PA0
    ch2:
      pin: PA1
    counts_per_rev: 2400
    input_type: open_collector
    pullup: external_3v3
    max_signal_freq_hz: 30000
    filter_level: 10

uart:
  telemetry:
    instance: USART2
    tx: PA2
    rx: PA3
    baud_bps: 460800

gpio:
  status_led:
    pin: PA5
  user_button:
    pin: PC13

safety:
  estop:
    sense:
      pin: PB10              # Arduino D6 (right rail)
      active_state: low        # low or high
      pull: pullup_3v3         # pullup_3v3 or pulldown
      debounce_ms: 10
    hw_cut:
      type: series_switch      # series_switch / relay / contactor / high_side
      notes: Cut motor VM supply to driver (preferred primary action)

sensors:
  lidar:
    model: ydlidar_g4
    interface: usb
    power_rail: 5v
    nominal_current_amps: 0.5   # confirm from datasheet
    notes: Connect via powered USB hub to Jetson; ensure stable 5 V
  depth_camera:
    model: realsense_d455
    interface: usb3
    power_rail: 5v
    notes: USB 3 bandwidth required; prefer powered hub if multiple devices
  imu:
    model: adafruit_bno080
    interface: i2c
    host: stm32_planned
    bus: stm_i2c1_planned
    sda_pin: PB9
    scl_pin: PB8
    power_pin: 3v3_logic
    gnd_pin: logic_gnd
    power_rail: 3v3
    notes: Planned STM I2C connection on PB8/PB9 shared with INA226. Use 3.3 V logic only, verify IMU and INA226 I2C addresses do not conflict, and keep leads short.
  proximity:
    quantity: 4
    model: hc_sr04_ultrasonic
    status: planned_provisional_pins
    power_rail: 5v
    interface: gpio_trig_echo
    units: distance           # mm in firmware
    level_shift: echo_divider_to_3v3   # ensure echo is 3.3 V safe
    firing_strategy: staggered_round_robin
    notes: Stagger triggers to avoid crosstalk; HC-SR04 echo is 5 V (level-shift to 3.3 V); add 0.1 uF + 10 uF per module; keep leads short. Pin candidates avoid PB3/SWO and reserve PB8/PB9 for STM I2C unless intentionally changed in CubeMX.
    shield_conditioning:
      trig_series_ohms: 100_to_330
      trig_pulldown_ohms: 100000
      echo_level_shift: required_5v_to_3v3
      echo_divider_example:
        r_top_ohms: 10000
        r_bottom_ohms: 20000
      echo_optional_filter:
        r_series_ohms: 100_to_330
        c_shunt_pf: 100_to_470
        notes: Keep RC small to avoid distorting pulse width.
      connector_per_sensor: [5v, trig, echo_3v3, gnd]
      decoupling_per_sensor: [100nf, 10uf]
    channels:
      - id: S1
        position: front_left
        trig_pin: PA10         # Arduino D2
        echo_pin: PC7          # Arduino D9
        notes: add divider or level shifter on echo if module drives 5 V high
      - id: S2
        position: front_right
        trig_pin: PC2          # candidate GPIO; verify Nucleo header/CubeMX before wiring
        echo_pin: PC3          # candidate GPIO; verify Nucleo header/CubeMX before wiring
        notes: add divider or level shifter on echo if module drives 5 V high; avoids PB3 because PB3 is SWO in current CubeMX
      - id: S3
        position: rear_left
        trig_pin: PA4          # Arduino A2
        echo_pin: PC0          # Arduino A5
        notes: add divider or level shifter on echo if module drives 5 V high
      - id: S4
        position: rear_right
        trig_pin: PB12         # candidate Morpho GPIO; verify Nucleo header/CubeMX before wiring
        echo_pin: PB13         # candidate Morpho GPIO; verify Nucleo header/CubeMX before wiring
        notes: add divider or level shifter on echo if module drives 5 V high; PB8/PB9 are reserved as STM I2C candidates

buses:
  jetson_i2c1:
    host: jetson_nano
    bus: /dev/i2c-1
    scl: J41-5
    sda: J41-3
    pullups: onboard_3v3
    status: available_not_selected_for_current_stm_sensor_plan
  stm_i2c1_planned:
    host: stm32
    scl: PB8
    sda: PB9
    pullups: external_3v3
    shared_devices: [imu, ina226_battery_monitor]
    status: planned_not_enabled_in_current_firmware
    pullups:
      voltage: 3v3
      recommended_ohms: 4700
      range_ohms: 2200_to_4700
      notes: Avoid duplicate strong pull-ups on IMU, INA226, and shield.
    series_damping_ohms: 22_to_100
    decoupling: [100nf_per_module, 1uf_to_10uf_bulk_near_connector]
    notes: On STM32F401RE PB8/PB9 are typically I2C1 SCL/SDA alternate-function pins; verify in CubeMX before firmware implementation. Power I2C devices at 3.3 V or add level shifting if any breakout forces 5 V pull-ups.

adc:
  vref_volts: 3.3
  resolution_bits: 12
  dma: enabled                 # ADC1 configured with DMA circular mode
  channels:
    # Motor current sensing (ACS758 + resistor divider + STM32 ADC)
    - id: motor_left_current
      pin: PB0                 # ADC1_IN8 (configured)
      name: I_MOTOR_LEFT
      source: acs758_vout
      divider:                 # scale 0-5 V to ~0-3.3 V (ratio ~0.667)
        r_top_ohms: 10000      # 10k (Vout from ACS758 to divider top)
        r_bottom_ohms: 20000   # 20k to GND + Vadc = 0.667 * Vsense
        v_in_max_volts: 5.0
        v_out_max_volts: 3.33
      filter:                  # simple post-divider RC for anti-aliasing/noise
        r_series_ohms: 1000
        c_shunt_nf: 100        # fc ~1.6 kHz; adjust per sampling rate
      status: active           # present in ADC regular sequence
    - id: motor_right_current
      pin: PC1                 # ADC1_IN11 (mapped, may be added to sequence)
      name: I_MOTOR_RIGHT
      source: acs758_vout
      divider:
        r_top_ohms: 10000
        r_bottom_ohms: 20000
        v_in_max_volts: 5.0
        v_out_max_volts: 3.33
      filter:
        r_series_ohms: 1000
        c_shunt_nf: 100
      status: active           # included in ADC regular sequence (Rank 2)
    - id: battery_pack_voltage
      pin: TBD                 # fallback only; choose after proximity pin ownership is finalized
      name: V_BATT_PACK
      source: robot_bus_load_side_of_shunt
      divider:
        status: planned
        design_goal: scale_14_6v_full_charge_to_under_3_3v_adc
        notes: Use high-value divider, input fuse or current limit, series resistor, RC filter, and optional clamp protection. Final resistor values and ADC pin TBD after confirming header availability, proximity pin ownership, and acceptable input impedance.
      filter:
        status: planned
        notes: Add RC filtering near STM ADC input for motor/PWM noise rejection.
      status: planned

current_sensors:
  model: ACS758LCB-050B        # Allegro Hall-effect current sensor +/-50 A
  quantity: 2                  # Left/Right motor lines
  supply_volts: 5.0            # Ratiometric output; 2.5 V at 0 A (typ.)
  placement: series_with_each_motor_supply
  output_interface: analog_single_ended
  variant: ACS758LCB-050B
  sensitivity_mV_per_A: 40     # @5 V; ~26.7 mV/A at ADC after 0.667 divider
  zero_current_offset_volts: ratiometric_to_vcc_over_2
  wiring_notes:
    - Keep high-current paths short; use appropriate gauge and creepage/clearance.
    - Route sensor Vout to STM32 ADC through the divider; add local 0.1 uF decoupling at sensor Vcc.
    - Tie grounds at a star point; avoid running Vout alongside PWM motor leads.

compute:
  jetson_nano:
    power_input_volts: 5.0
    recommended_current_amps: 4.0   # allow up to 6 A with peripherals
    ethernet: true
    usb3_ports: true
    csi_cameras: 2
    gpio_header_40pin: true

drivers:
  cytron_mdd20a:
    m1_pwm: PA8
    m1_dir: PB4
    m2_pwm: PA9
    m2_dir: PB5

notes:
  - Keep this file authoritative; update when wiring or firmware changes.
  - Align TIM1 ARR/PSC to achieve the desired PWM frequency (20 kHz target).
  - Encoder mount is post-gearbox.
